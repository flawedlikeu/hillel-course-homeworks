<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Слайдер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slider" id="slider">
    <div class="viewport">
      <div class="track">
        <div class="slide" style="background:#e76f51"></div>
        <div class="slide" style="background:#2a9d8f"></div>
        <div class="slide" style="background:#e9c46a"></div>
        <div class="slide" style="background:#457b9d"></div>
        <div class="slide" style="background:#8d6aa8"></div>
      </div>
    </div>
    <button class="btn prev">&#10094;</button>
    <button class="btn next">&#10095;</button>
    <button class="pause">Пауза</button>
    <div class="dots"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
